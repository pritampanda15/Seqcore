name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # pip-audit inspects the whole environment, so the build toolchain is
          # audited alongside Seqcore's own dependencies. Upgrade it first:
          # runner images ship pinned versions that routinely lag behind known
          # advisories, and the fix for those is to update, not to suppress.
          python -m pip install --upgrade pip setuptools wheel
          pip install bandit pip-audit
          pip install -e .

      - name: Run Bandit security linter
        run: bandit -r seqcore/ -ll -ii -x tests/

      - name: Check dependencies with pip-audit
        # Deliberately not suppressed with `|| true`: a findable vulnerability
        # should fail the build. If an advisory has no fix available yet, add an
        # explicit `--ignore-vuln <ID>` with a comment rather than muting the step.
        run: pip-audit --desc on

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
