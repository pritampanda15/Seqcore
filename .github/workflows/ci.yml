name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=seqcore --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-formats:
    name: Test File Formats
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test all file formats
        run: |
          python -c "
          import seqcore as sc
          import sys

          formats = [
              ('FASTA', 'tests/data/test_sequences.fasta', lambda x: len(x) == 5),
              ('FASTQ', 'tests/data/test_reads.fastq', lambda x: len(x) == 5),
              ('PDB', 'tests/data/test_protein.pdb', lambda x: len(x.atoms) > 0),
              ('VCF', 'tests/data/test_variants.vcf', lambda x: len(x['chrom']) == 10),
              ('SDF', 'tests/data/test_molecules.sdf', lambda x: len(x) == 3),
              ('MOL2', 'tests/data/test_molecule.mol2', lambda x: len(x) == 2),
              ('mmCIF', 'tests/data/test_structure.cif', lambda x: len(x.atoms) == 34),
              ('GFF3', 'tests/data/test_annotation.gff3', lambda x: len(x['seqid']) > 0),
              ('BED', 'tests/data/test_regions.bed', lambda x: len(x['chrom']) > 0),
              ('GenBank', 'tests/data/test_sequence.gb', lambda x: len(x) == 2),
              ('EMBL', 'tests/data/test_sequence.embl', lambda x: len(x) == 2),
              ('Newick', 'tests/data/test_tree.nwk', lambda x: len(x) == 3),
              ('Stockholm', 'tests/data/test_alignment.sto', lambda x: len(x) == 2),
              ('PHYLIP', 'tests/data/test_alignment.phy', lambda x: x is not None),
              ('SAM', 'tests/data/test_alignment.sam', lambda x: len(x['reads']) == 8),
              ('HDF5', 'tests/data/test_single_cell.h5ad', lambda x: x['X'].shape == (100, 50)),
          ]

          passed = 0
          failed = 0
          for name, path, check in formats:
              try:
                  data = sc.read(path)
                  assert check(data), f'Validation failed for {name}'
                  print(f'✓ {name}')
                  passed += 1
              except Exception as e:
                  print(f'✗ {name}: {e}')
                  failed += 1

          print(f'\nResults: {passed}/{len(formats)} formats passed')
          sys.exit(1 if failed > 0 else 0)
          "

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Check formatting with Black
        run: black --check --diff seqcore/

      - name: Check import sorting with isort
        run: isort --check-only --diff seqcore/

      - name: Lint with Ruff
        run: ruff check seqcore/

      - name: Type check with mypy
        run: mypy seqcore/ --ignore-missing-imports --no-error-summary || true

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Build documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
